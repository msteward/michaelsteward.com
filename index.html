<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Steward</title>
    <meta name="description" content="Michael Steward — personal site." />
    <meta name="theme-color" content="#0c0e0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f3ea" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <div class="page">
      <header class="statusbar">
        <div class="left">
          <span class="dot" aria-hidden="true"></span>
          <span>michaelsteward.com</span>
        </div>
        <div class="right">
          <button
            type="button"
            id="theme-toggle"
            class="themeToggle"
            aria-label="Toggle color scheme"
            aria-pressed="true"
          >
            <span class="themeOpt" data-theme-opt="light">light</span>
            <span class="themeOpt" data-theme-opt="dark">dark</span>
          </button>
          <span aria-hidden="true">·</span>
          <span>Vancouver, Canada</span>
          <span aria-hidden="true">·</span>
          <span id="clock"></span>
        </div>
      </header>

      <main class="main">
        <span class="eyebrow">~ / personal site</span>

        <h1 class="name">
          Michael <span class="last">Steward</span><span class="caret" aria-hidden="true"></span>
        </h1>

        <section class="whoami" aria-label="about">
          <div class="row">
            <span class="key">handle</span>
            <span class="val">stewardm</span>
          </div>
          <div class="row">
            <span class="key">note</span>
            <span class="val">this page is intentionally small. the rest lives elsewhere.</span>
          </div>
        </section>

        <ul class="links">
          <li>
            <a class="link" href="https://www.linkedin.com/in/stewardm/" target="_blank" rel="noopener noreferrer">
              <span class="arrow" aria-hidden="true">→</span>
              <span class="label">linkedin</span>
              <span class="target">/in/stewardm</span>
              <span class="external">linkedin.com ↗</span>
            </a>
          </li>
          <li>
            <a class="link" href="mailto:stewardm@gmail.com">
              <span class="arrow" aria-hidden="true">→</span>
              <span class="label">email</span>
              <span class="target">stewardm@gmail.com</span>
              <span class="external">mail ↗</span>
            </a>
          </li>
        </ul>
      </main>

      <footer class="footer">
        <span>© <span id="year"></span> michael steward</span>
        <span class="ascii">&lt; / &gt;</span>
        <span>built quietly</span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
